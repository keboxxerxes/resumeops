name: Infrastructure
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [apply, destroy]
        required: true
      confirmation:
        type: string
        description: 'For destroy type: DESTROY production SITE ONLY'
        required: false
permissions:
  contents: read
concurrency:
  group: resumeops-production
  cancel-in-progress: false
env:
  ALLOW_AWS_OPERATIONS: ${{ vars.ALLOW_AWS_OPERATIONS }}
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_site_bucket: ${{ secrets.SITE_BUCKET }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.ALLOW_AWS_OPERATIONS == 'true'
    runs-on: ubuntu-24.04
    environment: production-plan
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      OPERATION: ${{ inputs.operation }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
      - name: Verify actual repository protection before OIDC
        env:
          GH_PROTECTION_TOKEN: ${{ secrets.GH_PROTECTION_TOKEN }}
        run: node scripts/gate.mjs production-plan production-apply
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 3600
      - name: Initialize exact production state
        env:
          STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/site init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION" -backend-config='key=site/production/terraform.tfstate' -backend-config=encrypt=true -backend-config=use_lockfile=true > /dev/null 2>&1
      - name: Fresh private plan and encrypted handoff
        env:
          PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/confirm.mjs
          trap 'rm -f infra/site/candidate.tfplan' EXIT
          args=()
          if [ "$OPERATION" = destroy ]; then args+=(-destroy); fi
          terraform -chdir=infra/site plan -input=false -lock-timeout=5m -no-color "${args[@]}" -out=candidate.tfplan > /dev/null 2>&1
          mkdir -p .local/handoff
          node scripts/plan-crypto.mjs seal infra/site/candidate.tfplan .local/handoff/candidate.enc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encrypted-plan
          path: .local/handoff/candidate.enc
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.ALLOW_AWS_OPERATIONS == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    environment: production-apply
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      OPERATION: ${{ inputs.operation }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
      - name: Verify actual repository protection before OIDC
        env:
          GH_PROTECTION_TOKEN: ${{ secrets.GH_PROTECTION_TOKEN }}
        run: node scripts/gate.mjs production-plan production-apply
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 3600
      - name: Initialize exact production state
        env:
          STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/site init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION" -backend-config='key=site/production/terraform.tfstate' -backend-config=encrypt=true -backend-config=use_lockfile=true > /dev/null 2>&1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: encrypted-plan
          path: .local/handoff
      - name: Apply exact privately reviewed plan
        env:
          PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/confirm.mjs
          trap 'rm -f infra/site/candidate.tfplan .local/handoff/candidate.enc' EXIT
          node scripts/plan-crypto.mjs open .local/handoff/candidate.enc infra/site/candidate.tfplan
          terraform -chdir=infra/site apply -input=false -lock-timeout=5m -no-color candidate.tfplan > /dev/null 2>&1
          echo 'Exact reviewed site plan applied; bootstrap retained.'
