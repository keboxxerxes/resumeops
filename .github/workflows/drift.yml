name: Read-only drift
on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resumeops-production
  cancel-in-progress: false
env:
  ALLOW_AWS_OPERATIONS: ${{ vars.ALLOW_AWS_OPERATIONS }}
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_site_bucket: ${{ secrets.SITE_BUCKET }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
jobs:
  drift:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && vars.ALLOW_AWS_OPERATIONS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-drift
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
      - name: Verify actual repository protection before OIDC
        env:
          GH_PROTECTION_TOKEN: ${{ secrets.GH_PROTECTION_TOKEN }}
        run: node scripts/gate.mjs production-drift
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 3600
      - name: Initialize exact production state
        env:
          STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/site init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION" -backend-config='key=site/production/terraform.tfstate' -backend-config=encrypt=true -backend-config=use_lockfile=true > /dev/null 2>&1
      - name: Detect without applying
        run: |
          set -uo pipefail
          if terraform -chdir=infra/site plan -input=false -lock-timeout=5m -detailed-exitcode -no-color > /dev/null 2>&1; then result=0; else result=$?; fi
          node scripts/drift.mjs "$result" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$result" = 2 ]; then echo 'Drift requires operator review' >&2; exit 1; fi
          exit "$result"
